[project]
name = "youmo-workflow"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.131,<1",
  "uvicorn>=0.41,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.17,<2",
  "pillow>=12,<13",
  "pysubs2>=1.8,<2",
  "tzdata>=2025.2",
  "yt-dlp[default]==2026.11.23",
  "faster-whisper>=1.2,<2",
  "av>=16,<19",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2.13,<3", "ruff>=0.14,<1", "pyright>=1.1,<2", "pylint>=4,<5", "import-linter>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youmo_workflow"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C90", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-statements = 40

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "typings"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "youmo_workflow"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Pure domain"
type = "forbidden"
source_modules = ["youmo_workflow.domain"]
forbidden_modules = ["youmo_workflow.features", "youmo_workflow.orchestration", "youmo_workflow.adapters", "youmo_workflow.storage", "fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Adapters never control workflow"
type = "forbidden"
source_modules = ["youmo_workflow.adapters"]
forbidden_modules = ["youmo_workflow.features", "youmo_workflow.orchestration"]

[[tool.importlinter.contracts]]
name = "Features do not import orchestrator"
type = "forbidden"
source_modules = ["youmo_workflow.features"]
forbidden_modules = ["youmo_workflow.orchestration"]
